<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galeria de fotos</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="galeria de fotos.css">

</head>

<body>
    
    <header class="encabezado">

        <img src="img/logo escuela juan escutia.png"
             alt="Escudo de la escuela">

        <div class="nombre-escuela">

            <h1>Escuela Primaria “Juan Escutia”</h1>

        </div>


    <nav class="menu">

<button class="boton-menu"
onclick="mostrarMenu()">☰</button>

<div class="opciones-menu"

id="opcionesMenu">


        <a href="index.html">Inicio</a>

        <a href="avisos.html">Avisos</a>

        <a href="galeria de fotos.html">Galería de fotos</a>

        <a href="nosotros.html">Nosotros</a>

        <a href="contacto.html">Contacto</a>

    </div>

    </nav>

    </header>
    
<main class="pagina-galeria">

    <!-- PRESENTACIÓN -->
    <section class="presentacion-galeria">

        <div class="icono-camara">
            <img src="img/galeria de fotos.jpg" alt="Cámara">
        </div>

        <div class="texto-presentacion">
            <h2>Galería de Fotos</h2>

            <p>
                Conoce las actividades, eventos y momentos
                de nuestra escuela.
            </p>
        </div>

    </section>

    <!-- CONTENIDO PRINCIPAL -->
    <section class="contenido-galeria">

        <!-- COLUMNA IZQUIERDA: BUSCADOR -->
        <aside class="panel-busqueda">

            <h3>Buscar fotos</h3>

            <div class="buscador-fotos">

                <input
                    type="text"
                    id="buscarFoto"
                    placeholder="Buscar fotografías..."
                >

                <button id="botonBuscar" type="button">
                    Buscar
                </button>

            </div>

            <div id="resultadosBusqueda" class="resultados-busqueda">

                <p class="mensaje-busqueda">
                    Aquí aparecerán las fotografías encontradas.
                </p>

            </div>

        </aside>

        <!-- COLUMNA DERECHA: ÁLBUMES -->
        <section class="panel-albumes">

            <!-- CATEGORÍAS -->
            <nav class="categorias-galeria">

                <button class="categoria activa"
                    data-categoria="plantel">
                    Plantel
                </button>

                <button class="categoria"
                    data-categoria="eventos">
                    Eventos
                </button>

                <button class="categoria"
                    data-categoria="festivales">
                    Festivales
                </button>

                <button class="categoria"
                    data-categoria="deportes">
                    Deportes
                </button>

                <button class="categoria"
                    data-categoria="actividades">
                    Actividades
                </button>

            </nav>

            <!-- FOTOGRAFÍAS -->
            <div class="galeria-imagenes">

                <div class="album activo" data-album="plantel">

                    <img src="img/fachada de la escuela.jpg"
                        alt="Entrada del plantel"
                        data-nombre="Entrada del plantel">

                    <img src="img/explanada de la escuela.jpg"
                        alt="Explanada de la escuela"
                        data-nombre="Explanada de la escuela">

                    
                </div>

                <div class="album" data-album="eventos">

                    <img src="img/ofrenda 1-A.jpg"
                        alt="Ofrenda del dia de muertos del grupo 1-A, 2026"
                        data-nombre="Ofrenda del dia de muertos del grupo 1-A, 2026">

                    <img src="img/ofrenda 1-B.jpg"
                        alt="Ofrenda del dia de muertos del grupo 1-B, 2026"
                        data-nombre="Ofrenda del dia de muertos del grupo 1-B, 2026">

                    <img src="img/ofrenda 2-A.jpg"
                        alt="Ofrenda del dia de muertos del grupo 2-A, 2026"
                        data-nombre="Ofrenda del dia de muertos del grupo 2-A, 2026">    

                    <img src="img/ofrenda 2-B.jpg"
                        alt="Ofrenda del dia de muertos del grupo 2-B, 2026"
                        data-nombre="Ofrenda del dia de muertos del grupo 2-B, 2026">

                    <img src="img/ofrenda 3-A.jpg"
                        alt="Ofrenda del dia de muertos del grupo 3-A, 2026"
                        data-nombre="Ofrenda del dia de muertos del grupo 3-A, 2026">

                    <img src="img/ofrenda 3-B.jpg"
                        alt="Ofrenda del dia de muertos del grupo 3-B, 2026"
                        data-nombre="Ofrenda del dia de muertos del grupo 3-B, 2026">
                        
                    <img src="img/ofrenda 4-A.jpg"
                        alt="Ofrenda del dia de muertos del grupo 4-A, 2026"
                        data-nombre="Ofrenda del dia de muertos del grupo 4-A, 2026">

                    <img src="img/ofrenda 4-B.jpg"
                        alt="Ofrenda del dia de muertos del grupo 4-B, 2026"
                        data-nombre="Ofrenda del dia de muertos del grupo 4-B, 2026">

                    <img src="img/ofrenda 5-A.jpg"
                        alt="Ofrenda del dia de muertos del grupo 5-A, 2026"
                        data-nombre="Ofrenda del dia de muertos del grupo 5-A, 2026">    

                    <img src="img/ofrenda 5-B.jpg"
                        alt="Ofrenda del dia de muertos del grupo 5-B, 2026"
                        data-nombre="Ofrenda del dia de muertos del grupo 5-B, 2026">

                    <img src="img/ofrenda 6-A.jpg"
                        alt="Ofrenda del dia de muertos del grupo 6-A, 2026"
                        data-nombre="Ofrenda del dia de muertos del grupo 6-A, 2026">

                    <img src="img/ofrenda 6-B.jpg"
                        alt="Ofrenda del dia de muertos del grupo 6-B, 2026"
                        data-nombre="Ofrenda del dia de muertos del grupo 6-B, 2026"> 

                    <img src="img/concurso dia de muertos.jpg"
                        alt="Concurso de disfraces del dia de muertos, 2026"
                        data-nombre="Concurso de disfraces del dia de muertos, 2026">

                    <img src="img/foto dia de muertos.jpg"
                        alt="Evento del dia de muertos, 2026"
                        data-nombre="Evento del dia de muertos, 2026"> 

                </div>

                <div class="album" data-album="festivales">

                    <img src="img/festival de la revolucion mexicana.jpg"
                        alt="Festival del dia de la revolucion mexicana, 2026"
                        data-nombre="Festival del dia de la revolucion mexicana, 2026">

                   

                </div>

                <div class="album" data-album="deportes">

                    <img src="img/equipo de futbol.jpg"
                        alt="Equipo de futbol de la escuela primaria *Juan Escutia*"
                        data-nombre="Equipo de futbol de la escuela primaria *Juan Escutia*">

                    <img src="img/equipo de futbol 2.jpg"
                        alt="Equipo de futbol de la escuela primaria *Juan Escutia*"
                        data-nombre="Equipo de futbol de la escuela primaria *Juan Escutia*">

                    <img src="img/trofeo de la escuela 1.jpg"
                        alt="Trofeo de futbol de la escuela primaria *Juan Escutia*"
                        data-nombre="Trofeo de futbol de la escuela primaria *Juan Escutia*"> 

                </div>

                <div class="album" data-album="actividades">

                    <img src="img/ensayo de la revolucion mexicana.jpg"
                        alt="Preparación para el festival de la revolución mexicana"
                        data-nombre="Preparación para el festival de la revolución mexicana">

                    

                </div>

            </div>

        </section>

    </section>

    <div id="visorImagen" class="visor-imagen">
    <span id="cerrarVisor" class="cerrar-visor">&times;</span>
    <img id="imagenAmpliada" src="" alt="Fotografía ampliada">
</div>

<div class="linea-separadora3"></div>

<div class="decoracion-inferior">
    <svg viewBox="0 0 1440 150" preserveAspectRatio="none">
        <path d="M0,70 C240,150 480,0 720,70 C960,140 1200,10 1440,70 L1440,150 L0,150 Z"
        fill="#7B0D26"/>
    </svg>
</div>

</main>


    <script src="galeria de fotos.js"></script>
    <script src="script.js"></script>
</body>
</html>
